<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title description">
  <title id="title">One screen, two keyboard tops</title>
  <desc id="description">Line-art schematic of the Onyx Boox mention-list bug: the keyboard API reports its top at y=901 while the keyboard actually starts at y=651; a list anchored to the reported top is drawn behind the keys, a list anchored to the measured nav bar top is visible.</desc>
  <rect id="canvas" x="0" y="0" width="900" height="1200" fill="white" />
  <g id="phone">
    <rect id="phone-body" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round" x="250" y="40" width="400" height="1100" />
  </g>
  <g id="editor">
    <text id="editor-label" fill="black" stroke="none" font-family="Courier New, Liberation Mono, monospace" font-size="16" font-weight="normal" font-style="normal" xml:space="preserve">
      <tspan x="280" y="86.0">1:1 note editor</tspan>
    </text>
    <line id="editor-line-1" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" x1="280" y1="110" x2="560" y2="110" />
    <line id="editor-line-2" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" x1="280" y1="150" x2="620" y2="150" />
    <line id="editor-line-3" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" x1="280" y1="190" x2="540" y2="190" />
  </g>
  <g id="right-list">
    <rect id="list-box-visible" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round" x="270" y="250" width="360" height="180" />
    <line id="list-row-1" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" x1="290" y1="290" x2="610" y2="290" />
    <line id="list-row-2" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" x1="290" y1="330" x2="590" y2="330" />
    <line id="list-row-3" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" x1="290" y1="370" x2="610" y2="370" />
  </g>
  <g id="nav-bar">
    <rect id="nav-band" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round" x="250" y="440" width="400" height="36" />
    <text id="nav-label" fill="black" stroke="none" font-family="Courier New, Liberation Mono, monospace" font-size="16" font-weight="normal" font-style="normal" xml:space="preserve">
      <tspan x="270" y="462.0">nav bar</tspan>
    </text>
  </g>
  <g id="wrong-list">
    <rect id="list-box-hidden" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round" x="270" y="520" width="360" height="180" />
    <line id="hidden-row-1" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" x1="290" y1="560" x2="610" y2="560" />
    <line id="hidden-row-2" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" x1="290" y1="610" x2="590" y2="610" />
    <line id="hidden-row-3" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" x1="290" y1="660" x2="610" y2="660" />
  </g>
  <g id="keyboard">
