    <rect id="key-10-1" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round" x="270" y="980" width="76" height="44" />
    <rect id="key-10-2" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round" x="362" y="980" width="76" height="44" />
