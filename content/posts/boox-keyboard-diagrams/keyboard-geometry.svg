  <g id="reported-topline">
    <circle id="reported-mark-left" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round" cx="250" cy="700" r="7" />
    <line id="reported-line" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" x1="250" y1="700" x2="650" y2="700" />
    <circle id="reported-mark-right" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round" cx="650" cy="700" r="7" />
  </g>
  <g id="label-keyboard">
    <text id="keyboard-label" fill="black" stroke="none" font-family="Courier New, Liberation Mono, monospace" font-size="18" font-weight="normal" font-style="normal" xml:space="preserve">
      <tspan x="30" y="513.0">actual keyboard</tspan>
      <tspan x="30" y="534.6">top = ~651</tspan>
    </text>
  </g>
  <g id="label-reported">
    <text id="reported-label" fill="black" stroke="none" font-family="Courier New, Liberation Mono, monospace" font-size="18" font-weight="normal" font-style="normal" xml:space="preserve">
      <tspan x="30" y="658.0">Keyboard.metrics()</tspan>
      <tspan x="30" y="679.6">screenY = 901</tspan>
      <tspan x="30" y="701.2">says top is here</tspan>
    </text>
  </g>
  <g id="label-visible">
    <text id="visible-label" fill="black" stroke="none" font-family="Courier New, Liberation Mono, monospace" font-size="18" font-weight="normal" font-style="normal" xml:space="preserve">
      <tspan x="665" y="288.0">anchored to measured</tspan>
      <tspan x="665" y="309.6">nav bar top (651):</tspan>
      <tspan x="665" y="331.2">visible</tspan>
    </text>
  </g>
  <g id="label-hidden">
    <text id="hidden-label" fill="black" stroke="none" font-family="Courier New, Liberation Mono, monospace" font-size="18" font-weight="normal" font-style="normal" xml:space="preserve">
      <tspan x="665" y="573.0">anchored to reported</tspan>
      <tspan x="665" y="594.6">top (901): hidden</tspan>
      <tspan x="665" y="616.2">behind the keys</tspan>
    </text>
  </g>
</svg>