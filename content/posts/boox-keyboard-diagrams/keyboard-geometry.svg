    <rect id="key-8-2" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round" x="362" y="860" width="76" height="44" />
    <rect id="key-8-3" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round" x="454" y="860" width="76" height="44" />
    <rect id="key-8-4" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round" x="546" y="860" width="76" height="44" />
