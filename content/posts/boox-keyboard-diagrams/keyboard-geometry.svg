    <rect id="key-3-4" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round" x="546" y="620" width="76" height="44" />
    <rect id="key-5-1" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round" x="270" y="680" width="76" height="44" />
    <rect id="key-5-2" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round" x="362" y="680" width="76" height="44" />
    <rect id="key-5-3" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round" x="454" y="680" width="76" height="44" />
    <rect id="key-5-4" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round" x="546" y="680" width="76" height="44" />
    <rect id="key-6-1" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round" x="270" y="740" width="76" height="44" />
    <rect id="key-6-2" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round" x="362" y="740" width="76" height="44" />
